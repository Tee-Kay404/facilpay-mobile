# Configurations
flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#2073F2"
  background_image: "assets/images/splash_background.png"
  image: assets/images/icon_white.png
  android_12:
    color: "#2073F2"
    image: assets/images/icon_white.png

flutter:
  uses-material-design: true

  assets:
    # - .env
    - lib/images/
    - assets/images/
    - assets/icons/
    - assets/svgs/more_icons/
    - assets/active_navbar_icon/
    - assets/inactive_navbar_icon/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Light.otf
          weight: 300
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-SemiBold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
